function live(S) {
  const r = { podFact: 0, podAll: 0, direct: 0, works: 0, received: 0, paidSubs: 0, stage: { 1: 0, 2: 0, 3: 0, 4: 0 } };
  S.expenses.forEach(e => {
    if (!e.acc) return;
    if (e.payer === 'direct') r.direct += e.acc; else { r.podAll += e.acc; if (!e.internal) r.podFact += e.acc; }
    if (!e.internal) r.stage[SEC_STAGE[e.sec]] += e.acc;
  });
  S.works.forEach(w => {
    if (!w.res) return;
    const a = toUsd(CT[w.c].cur, w.res.accrued);
    r.works += a; r.stage[SEC_STAGE[CT[w.c].section]] += a;
  });
  S.transfers.forEach(t => {
    if (t.status !== 'received' || t.from !== 'owner') return;
    if (t.to === 'bakh') r.received += t.usd; else r.paidSubs += t.usd;
  });
  return r;
}

  const paidSubs = BASE.paid + l.paidSubs;
  const withdrawn = S.partners.owner + S.partners.partner;
  const cash = clientRec - transferred - direct - paidSubs - withdrawn;
  const inTransit = S.transfers.filter(t => t.from === 'owner' && t.status === 'sent').reduce((a, t) => a + t.usd, 0);
  const earned = Math.round((fact * MARGIN) / PLAN);
  const share = Math.round(earned / 2);
  const review = S.expenses.filter(e => ['sent', 'returned', 'partial'].includes(e.status));
  const reviewSum = review.reduce((a, e) => a + (e.status === 'partial' ? (e.restRejected ? 0 : e.usd - e.acc) : e.usd), 0);
  const stages = STAGES.map(s => ({ ...s, factLive: BASE.stage[s.id] + l.stage[s.id], plan: stagePlan(s.id, 'c'), client: stagePlan(s.id, 'p') }));
  return { pod, direct, works, fact, clientRec, transferred, hands, paidSubs, withdrawn, cash, inTransit, earned, share,
    progress: (fact * 100) / PLAN, reviewN: S.expenses.filter(e => e.status === 'sent').length, reviewSum, stages };
}

// Подотчёт исполнителя — 7 показателей (ТЗ с. 12–13).
function podFor(S, who) {
  const received = S.transfers.filter(t => t.to === who && t.status === 'received' && t.purpose !== 'Оплата принятых работ').reduce((a, t) => a + t.usd, 0);
  const ex = S.expenses.filter(e => e.who === who && e.payer === 'pod' && e.status !== 'draft');
  const paid = ex.reduce((a, e) => a + e.usd, 0);
  const accepted = ex.reduce((a, e) => a + e.acc, 0);
  const review = ex.reduce((a, e) => a + (['sent', 'returned'].includes(e.status) ? e.usd : e.status === 'partial' && !e.restRejected ? e.usd - e.acc : 0), 0);
  const accrued = Math.round(accepted * 0.1); // договор «% от расходов»: 10% × принятые расходы
  const over = Math.max(0, accepted - received);
  return { received, paid, balance: received - paid, accepted, review, under: received - accepted, accrued, over, toPay: accrued + over };
}

function workCalc(S, w, mode = 'full', vol = w.vol, holdPct = 20) {
  const c = CT[w.c], cs = S.cs[w.c];
  const accVol = mode === 'partial' ? vol : w.vol;
  const accrued = w.fix ? w.fix : accVol * c.rate;
  const adv = Math.min(Math.max(0, cs.advance - cs.advClosed), accrued);
  const hold = mode === 'remarks' ? Math.round((accrued * holdPct) / 100) : 0;
  return { accVol, accrued, adv, hold, toPay: accrued - adv - hold };
}

  return html`<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/50 p-0 sm:p-4" onClick=${() => ask(null)}>
    <div className="w-full sm:max-w-md bg-white rounded-t-2xl sm:rounded-2xl shadow-xl max-h-[90vh] overflow-y-auto" onClick=${e => e.stopPropagation()}>
      <div className="p-5">
        <div className="flex items-start gap-3"><h3 className="flex-1 font-semibold text-slate-900">${modal.title}</h3>
          <button className="text-slate-400 hover:text-slate-700" onClick=${() => ask(null)}><${Icon} n="x" s=${18} /></button></div>
        ${modal.note && html`<div className="mt-3"><${Note} tone=${modal.noteTone || 'slate'}>${modal.note}<//></div>`}
        ${modal.body}
        <div className="mt-4 space-y-3">
          ${fields.map(f => html`<label key=${f.key} className="block">
            <span className="text-xs font-medium text-slate-600">${f.label}${f.required && html`<span className="text-red-600"> *</span>`}</span>
            ${f.type === 'textarea' ? html`<textarea rows="3" className=${cx(inputCls, 'mt-1')} placeholder=${f.placeholder} value=${vals[f.key] ?? ''} onChange=${e => set(f.key, e.target.value)}></textarea>`
              : f.type === 'select' ? html`<select className=${cx(inputCls, 'mt-1')} value=${vals[f.key] ?? ''} onChange=${e => set(f.key, e.target.value)}>${f.options.map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select>`
              : html`<input type=${f.type || 'text'} inputMode=${f.type === 'number' ? 'decimal' : undefined} className=${cx(inputCls, 'mt-1 num')} placeholder=${f.placeholder} value=${vals[f.key] ?? ''} onChange=${e => set(f.key, e.target.value)} />`}
            ${f.hint && html`<span className="block text-[11px] text-slate-500 mt-1">${typeof f.hint === 'function' ? f.hint(vals) : f.hint}</span>`}</label>`)}
          ${modal.preview && modal.preview(vals)}
        </div>
        ${modal.validate && modal.validate(vals) && html`<p className="mt-2 text-xs text-red-700">${modal.validate(vals)}</p>`}
        <div className="mt-5 flex gap-2 justify-end">
          <${Btn} tone="ghost" onClick=${() => ask(null)}>${modal.cancel || 'Отмена'}<//>
          ${modal.onOk && html`<${Btn} tone=${modal.okTone || 'orange'} disabled=${bad} onClick=${() => { modal.onOk(vals); ask(null); }}>${modal.ok || 'Готово'}<//>`}
        </div>
      </div></div></div>`;
}
function Toast({ t }) {
  if (!t) return null;
  return html`<div key=${t.k} className="no-print fixed z-[60] bottom-5 left-1/2 -translate-x-1/2 max-w-[92vw] rounded-2xl bg-slate-900 text-white text-sm px-4 py-3 shadow-xl flex items-center gap-2">
    <${Icon} n=${t.icon || 'check'} s=${16} className="text-emerald-400" /><span>${t.msg}</span></div>`;
}

/* ---------- Общие действия (рукопожатие) ---------- */
function askTransfer(c, { from, to, amount, cur = 'USD', purpose = 'Под отчёт', extra = {}, onDone }) {
  c.ask({
    title: 'Передать деньги: ' + P[to].name,
    note: 'Деньги передаются вне приложения (наличные, карта) — здесь фиксируем факт. Сумма может отличаться от запрошенной. Засчитается, когда получатель нажмёт «Получил».',
    fields: [
      { key: 'amount', label: 'Сумма', type: 'number', value: cur === 'USD' ? amount / 100 : amount, required: true },
      { key: 'cur', label: 'Валюта передачи', type: 'select', options: ['USD', 'UZS'], value: cur },
      { key: 'rate', label: 'Фактический курс, сум за $1', type: 'number', value: RATE, hint: 'Курс ЦБ ' + nf0.format(CB_RATE) + ' — только подсказка. Хранятся обе суммы и курс.', showIf: v => v.cur === 'UZS' },
      { key: 'purpose', label: 'Назначение', type: 'select', options: ['Под отчёт', 'Аванс по работам', 'Оплата принятых работ', 'Возмещение расходов', 'Выплата вознаграждения', 'Возврат'], value: purpose },
    ],
    validate: v => (+v.amount > 0 ? '' : 'Укажите сумму'),
    ok: 'Передал',
    onOk: v => {
      const amt = v.cur === 'USD' ? Math.round(+v.amount * 100) : Math.round(+v.amount);
      const rate = +v.rate || RATE;
      c.act(n => { n.transfers.push({ id: uid('t'), from, to, cur: v.cur, amount: amt, rate: v.cur === 'UZS' ? rate : null, usd: toUsd(v.cur, amt, rate), purpose: v.purpose, date: TODAY, status: 'sent', ...extra }); onDone && onDone(n); });
      c.say('«Передал» зафиксировано. Ждём «Получил» от ' + P[to].short);
    },
  });
}
function receive(c, id) {
  c.act(n => {
    const t = n.transfers.find(x => x.id === id); t.status = 'received';
    if (t.work) { const w = n.works.find(x => x.id === t.work); n.cs[w.c].paid += t.amount; w.paid = true; }
    if (t.contract && t.purpose === 'Аванс по работам') n.cs[t.contract].advance += t.amount;
    if (t.from === 'bakh' && t.contract) {
      // Строка в отчёте прораба появляется сама — повторный ввод не нужен (ТЗ с. 16).
      const adv = t.purpose === 'Аванс по работам';
      n.expenses.unshift(mkE(uid('e'), 'bakh', TODAY, CT[t.contract].section, adv ? 'Аванс субподрядчику' : 'Работа', (adv ? 'Аванс: ' : 'Оплата принятых работ: ') + P[t.to].short, 1, 'услуга', t.amount, t.cur, P[t.to].short, { status: 'accepted', receipt: false, auto: true, internal: true }));
    }
    if (t.req) { const r = n.requests.find(x => x.id === t.req); if (r) r.status = 'done'; }
  });
  c.say('«Получил» — операция подтверждена обеими сторонами');
}
function acceptWorkModal(c, w, mode) {
  const { S } = c; const ct = CT[w.c];
  const calcV = v => workCalc(S, w, mode, Math.min(w.vol, +v.vol || 0), +v.hold || 0);
  const fields = [];
  if (mode === 'partial') fields.push({ key: 'vol', label: 'Принимаемый объём, ' + ct.unit + ' (из ' + w.vol + ')', type: 'number', value: Math.round(w.vol * 0.8), required: true });
  if (mode === 'remarks') { fields.push({ key: 'hold', label: 'Удержание до исправления, %', type: 'number', value: 20 }); }
  if (mode !== 'full') fields.push({ key: 'comment', label: 'Комментарий', type: 'textarea', required: true, placeholder: mode === 'partial' ? 'Например: 20 м² — неровный шов, переделать' : 'Например: окна — исправить цвет откосов' });
  c.ask({
    title: { full: 'Принять полностью', partial: 'Принять частично', remarks: 'Принять с замечаниями' }[mode] + ': ' + ct.title,
    fields,
    preview: v => { const r = calcV(v); return html`<div className="rounded-xl bg-slate-50 ring-1 ring-slate-200 px-3 py-2">
      ${!w.fix && html`<${Row} k="Начислено" v=${r.accVol + ' ' + ct.unit + ' × ' + money(ct.cur, ct.rate) + ' = ' + money(ct.cur, r.accrued)} />`}
      ${w.fix && html`<${Row} k="Начислено за этап" v=${money(ct.cur, r.accrued)} />`}
      <${Row} k="Зачёт аванса" v=${'− ' + money(ct.cur, r.adv)} />
      ${r.hold > 0 && html`<${Row} k="Удержание до исправления" v=${'− ' + money(ct.cur, r.hold)} tone="amber" />`}
      <${Row} k="К оплате" v=${money(ct.cur, r.toPay)} strong tone="green" /></div>`; },
    validate: v => (mode === 'partial' && !(+v.vol > 0 && +v.vol <= w.vol) ? 'Объём от 1 до ' + w.vol : ''),
    ok: 'Принять',
    onOk: v => {
      const r = calcV(v);
      c.act(n => {
        const ww = n.works.find(x => x.id === w.id); const cs = n.cs[w.c];
        ww.status = mode === 'full' ? 'accepted' : mode; ww.res = { ...r, comment: v.comment || '' };
        cs.accVol = (cs.accVol || 0) + r.accVol; cs.accrued += r.accrued; cs.advClosed += r.adv; cs.hold += r.hold;
        if (ct.section === 'wall' || ct.section === 'el') n.report.touched = true;
      });
      c.say('Принято: начислено ' + money(ct.cur, r.accrued) + ', к оплате ' + money(ct.cur, r.toPay));
    },
  });
}
function returnWorkModal(c, w) {
  c.ask({ title: 'Вернуть работу: ' + CT[w.c].title, fields: [{ key: 'comment', label: 'Что исправить', type: 'textarea', required: true, placeholder: 'Возврат — только с комментарием' }], ok: 'Вернуть', okTone: 'dark',
    onOk: v => { c.act(n => { const ww = n.works.find(x => x.id === w.id); ww.status = 'returned'; ww.res = null; ww.back = v.comment; }); c.say('Работа возвращена исполнителю с комментарием', 'undo'); } });
}

/* ---------- «Ждёт вас» для каждого участника ---------- */
function todos(c, who) {
  const { S, go } = c; const out = [];
  S.transfers.filter(t => t.to === who && t.status === 'sent').forEach(t => out.push({ k: t.id, tone: 'orange', icon: 'hand',
    text: P[t.from].short + ' передал ' + money(t.cur, t.amount) + (t.rate ? ' (по курсу ' + nf0.format(t.rate) + ')' : ''), sub: t.purpose + ' · подтвердите получение', btn: 'Получил', on: () => receive(c, t.id) }));
  S.requests.filter(r => r.to === who && r.status === 'new').forEach(r => out.push({ k: r.id, tone: 'orange', icon: 'wallet',
    text: P[r.from].short + ' просит ' + money(r.cur, r.amount) + ' · ' + r.kind.toLowerCase(), sub: r.parts || 'без разбивки', btn: 'Передал',
    on: () => askTransfer(c, { from: who, to: r.from, amount: r.amount, cur: r.cur, purpose: r.kind === 'Аванс' ? 'Аванс по работам' : 'Под отчёт', extra: { req: r.id, contract: r.contract }, onDone: n => { n.requests.find(x => x.id === r.id).status = 'done'; } }) }));
  S.works.filter(w => w.status === 'pending').forEach(w => {
    const ct = CT[w.c];
    if (ct.receiver === who) out.push({ k: w.id, tone: 'orange', icon: 'check', text: P[ct.to].short + ' сдал: ' + ct.title.toLowerCase() + (w.vol ? ' ' + w.vol + ' ' + ct.unit : ''), sub: w.photos + ' фото' + (w.video ? ' + видео' : '') + ' · ' + fd(w.date), btn: 'Проверить', on: () => (who === 'owner' ? go({ web: 'works' }) : go({ tg: 'accept' })) });
    else if (who === 'owner') out.push({ k: w.id, tone: 'amber', icon: 'clock', text: P[ct.to].short + ' сдал ' + ct.title.toLowerCase() + ' ' + w.vol + ' ' + ct.unit, sub: 'Приёмщик — ' + P[ct.receiver].short + '. Вы видите приёмку и можете оспорить до оплаты', btn: 'Открыть', on: () => go({ web: 'works' }) });
  });
  S.works.filter(w => w.res && !w.payT && w.res.toPay > 0 && CT[w.c].from === who).forEach(w => {
    const ct = CT[w.c];
    out.push({ k: 'p' + w.id, tone: 'orange', icon: 'wallet', text: 'Оплатить ' + (P[ct.to].dat || P[ct.to].short) + ' ' + money(ct.cur, w.res.toPay), sub: 'За принятые ' + (w.res.accVol ? w.res.accVol + ' ' + ct.unit : 'работы') + ', аванс уже зачтён', btn: 'Передал',
      on: () => askTransfer(c, { from: who, to: ct.to, amount: w.res.toPay, cur: ct.cur, purpose: 'Оплата принятых работ', extra: { work: w.id, contract: w.c }, onDone: n => { n.works.find(x => x.id === w.id).payT = true; } }) });
  });
  if (who === 'owner') {
    const n = S.expenses.filter(e => e.status === 'sent');
    if (n.length) out.push({ k: 'exp', tone: 'orange', icon: 'receipt', text: n.length + ' расход(а) на проверке · ' + usd(n.reduce((a, e) => a + e.usd, 0)), sub: 'Salom Penthouse · принять, вернуть или отклонить', btn: 'Проверить', on: () => go({ web: 'expenses' }) });
    if (S.report.status === 'ready') out.push({ k: 'rep', tone: 'orange', icon: 'file', text: 'Отчёт по траншу 2 собран — отправить клиенту', sub: 'Собран сам из принятого ниже по цепочке', btn: 'Открыть', on: () => go({ web: 'report' }) });
    if (S.tranches[2].status === 'sent') out.push({ k: 'tr3', tone: 'orange', icon: 'hand', text: 'Клиент передал транш 3 · ' + usd(S.tranches[2].amount), sub: 'Подтвердите получение', btn: 'Получил', on: () => go({ web: 'report' }) });
    if (S.proposal.status === 'proposed') out.push({ k: 'kit', tone: 'amber', icon: 'clock', text: 'Кухня, Юнусабад 19-4: предложение ждёт клиента', sub: 'Отправлено по ссылке ' + KITCHEN.code, btn: 'Ссылка', on: () => go({ web: 'proposal' }) });
    if (S.proposal.status === 'returned') out.push({ k: 'kit', tone: 'orange', icon: 'undo', text: 'Клиент вернул предложение по кухне', sub: '«' + S.proposal.comment + '»', btn: 'Открыть', on: () => go({ web: 'proposal' }) });
  }
  if (who === 'bakh') {
    S.expenses.filter(e => e.who === 'bakh' && e.status === 'returned').forEach(e => out.push({ k: e.id, tone: 'orange', icon: 'undo', text: 'Возвращён расход: ' + e.name + ' · ' + money(e.cur, e.amount), sub: '«' + e.comment + '»', btn: 'Исправить',
      on: () => c.ask({ title: 'Исправить расход', body: html`<div className="mt-3 flex gap-3 items-center"><${Receipt} e=${{ ...e, receipt: true }} /><div className="text-sm text-slate-600">Прикрепляем фото чека и отправляем снова. Сумма и раздел — без изменений.</div></div>`, ok: 'Отправить снова',
        onOk: () => { c.act(n => { const x = n.expenses.find(y => y.id === e.id); x.receipt = true; x.status = 'sent'; x.comment = 'Исправлено: приложено фото'; }); c.say('Отправлено Джурабеку на проверку'); } }) }));
    if (S.groupDraft) out.push({ k: 'grp', tone: 'violet', icon: 'spark', text: 'ИИ-агент из группы «Salom — объект»', sub: 'Голосовое: «цемент 20 мешков по 6 долларов строймаркет» → черновик', btn: 'Открыть', on: () => { c.act(n => { n.groupDraft = false; }); go({ tg: 'expense', draft: 'цемент 20 мешков по 6 долларов строймаркет' }); } });
  }
  if (who === 'sherzod' || who === 'nodir') {
    S.works.filter(w => CT[w.c].to === who && w.res && !w.paid).forEach(w => out.push({ k: 'r' + w.id, tone: 'green', icon: 'check', text: 'Принято ' + (w.res.accVol || '') + ' ' + CT[w.c].unit + ' · к оплате ' + money(CT[w.c].cur, w.res.toPay), sub: w.payT ? 'Ждите «Передал» — уже отправлено' : 'Заказчик получил задачу «Оплатить»', btn: null }));
    S.works.filter(w => CT[w.c].to === who && w.status === 'returned').forEach(w => out.push({ k: 'b' + w.id, tone: 'red', icon: 'undo', text: 'Работа возвращена: ' + w.vol + ' ' + CT[w.c].unit, sub: '«' + w.back + '»', btn: 'Сдать снова', on: () => go({ tg: 'work' }) }));
    S.works.filter(w => CT[w.c].to === who && w.status === 'pending').forEach(w => out.push({ k: 'q' + w.id, tone: 'amber', icon: 'clock', text: 'На приёмке: ' + w.vol + ' ' + CT[w.c].unit + ' с ' + fd(w.date), sub: 'Приёмщик — ' + P[CT[w.c].receiver].short, btn: null }));
  }
  return out;
}
function TodoList({ items, compact }) {
  const tone = { orange: 'border-l-orange-500', amber: 'border-l-amber-400', green: 'border-l-emerald-500', red: 'border-l-red-500', violet: 'border-l-violet-500' };
  const ic = { orange: 'text-orange-600 bg-orange-50', amber: 'text-amber-700 bg-amber-50', green: 'text-emerald-700 bg-emerald-50', red: 'text-red-700 bg-red-50', violet: 'text-violet-700 bg-violet-50' };
  if (!items.length) return html`<div className="text-sm text-slate-500 py-3 flex items-center gap-2"><${Icon} n="check" className="text-emerald-600" />Всё подтверждено — ничего не ждёт</div>`;
  return html`<div className="space-y-2">${items.map(t => html`<div key=${t.k} className=${cx('flex items-center gap-3 bg-white rounded-xl border border-slate-200 border-l-4 px-3 py-2.5', tone[t.tone])}>
    <div className=${cx('w-8 h-8 rounded-lg grid place-items-center shrink-0', ic[t.tone])}><${Icon} n=${t.icon} s=${16} /></div>

    ${t.btn && html`<${Btn} size="sm" tone=${t.btn === 'Открыть' || t.btn === 'Ссылка' ? 'ghost' : 'orange'} onClick=${t.on}>${t.btn}<//>`}</div>`)}</div>`;
}

        <div className="text-xs text-slate-500">${ct.model} · ${ct.short} · сдано ${fd(w.date)} · приёмщик: ${ct.receiver === 'owner' ? 'Ganiev Development' : P[ct.receiver].short}</div></div>
      <${Chip} tone=${st[1]}>${st[0]}<//></div>

      <div className="relative h-2.5 rounded-full bg-slate-100 overflow-hidden"><div className="absolute inset-y-0 left-0 bg-emerald-500" style=${{ width: pct(cs.accVol || 0, ct.total) + '%' }}></div>

      <div className="mt-1 text-[11px] text-slate-500">${w.status === 'pending' ? 'Сдано ' + w.vol + ' ' + ct.unit + ' из ' + ct.total : ''}</div></div>`}
    <div className=${cx('mt-3 flex gap-2 overflow-x-auto no-scrollbar', mobile && '-mx-1 px-1')}>${Array.from({ length: w.photos }).map((_, i) => html`<${Photo} key=${i} i=${i + (w.c === 'nodir' ? 2 : 0)} label=${'фото ' + (i + 1)} />`)}${w.video ? html`<${Photo} i=${4} label="видео" video=${true} />` : null}</div>

      <${Row} k="Зачёт аванса" v=${'− ' + money(ct.cur, prev.adv)} /><${Row} k="К оплате" v=${money(ct.cur, prev.toPay)} strong tone="green" /></div>`}

      <${Row} k="Зачтён аванс" v=${'− ' + money(ct.cur, w.res.adv)} />${w.res.hold > 0 && html`<${Row} k="Удержание до исправления" v=${'− ' + money(ct.cur, w.res.hold)} tone="amber" />`}

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));

          <div className="mt-1 flex flex-wrap gap-1.5"><${Chip} tone=${stLabel[1]}>${stLabel[0]}<//><${Chip} tone="violet" icon="spark">собран автоматически из подтверждённого ниже<//></div></div>

          ${S.report.status === 'ready' && html`<${Btn} size="sm" icon="send" onClick=${() => { act(n => { n.report.status = 'sent'; n.tranches[1].status = 'reporting'; }); say('Отчёт отправлен клиенту — он увидит ровно этот вид'); }}>Отправить клиенту<//>`}</div></div>

        <div className="mt-3 flex gap-2"><${Btn} size="sm" tone="ghost" onClick=${() => askTransfer(c, { from: 'bakh', to: 'sherzod', amount: 1000000, cur: 'UZS', purpose: 'Аванс по работам', extra: { contract: 'sherzod' } })}>Выдать аванс<//><${Btn} size="sm" onClick=${() => go({ tg: 'accept' })}>Принять работу<//></div></div></div>`;
  }
  const ct = CT[who]; const cs = S.cs[who]; const toPay = cs.accrued - cs.advClosed - cs.hold - cs.paid;
  return html`<div className="pb-6">
    <${TgH}>Мой договор<//>
    <div className="mx-3 bg-white rounded-2xl overflow-hidden"><div className="bg-violet-600 text-white p-4"><div className="text-xs text-violet-200">${ct.model}</div><div className="font-bold">${ct.title}</div><div className="text-xs text-violet-200">заказчик: ${ct.from === 'owner' ? 'Ganiev Development' : P[ct.from].name} · срок ${fdy(ct.due)}</div></div>
      <div className="p-4"><div className="rounded-xl bg-violet-50 p-3 text-center"><div className="text-[11px] text-violet-700">Ваша ставка</div><div className="num text-3xl font-bold text-violet-900">${money(ct.cur, ct.rate)}<span className="text-base font-semibold">/${ct.unit}</span></div><div className="num text-xs text-violet-700 mt-0.5">${ct.total} ${ct.unit} = ${money(ct.cur, ct.total * ct.rate)}</div></div>
        <div className="mt-3"><${Row} k="Аванс получен" v=${money(ct.cur, cs.advance)} /><${Row} k="Принято" v=${cs.accVol + ' из ' + ct.total + ' ' + ct.unit} /><${Row} k="Начислено" v=${money(ct.cur, cs.accrued)} /><${Row} k="Зачтено аванса" v=${money(ct.cur, cs.advClosed)} />
          ${cs.hold > 0 && html`<${Row} k="Удержано до исправления" v=${money(ct.cur, cs.hold)} tone="amber" />`}<${Row} k="Выплачено" v=${money(ct.cur, cs.paid)} /><${Row} k="Осталось получить" v=${money(ct.cur, Math.max(0, toPay))} strong tone="green" /></div>
        ${lockLine(who === 'nodir' ? 'Цена генподрядчика у клиента скрыта: вы видите только свои $8/м²' : 'Договор прораба с генподрядчиком и его цены скрыты')}</div></div>
    <div className="mx-3 mt-3"><${Btn} full onClick=${() => go({ tg: 'work' })} icon="check">Сдать работу<//></div></div>`;
}

function TgRequest() {
  const c = useC(); const { act, ui, go, say } = c; const who = ui.who;
  const isBakh = who === 'bakh'; const ct = CT[who];
  const [kind, setKind] = useState(isBakh ? 'Под отчёт' : 'Аванс');
  const [mat, setMat] = useState(isBakh ? 2000 : 0); const [wrk, setWrk] = useState(isBakh ? 1000 : 0);
  const [amount, setAmount] = useState(isBakh ? 3000 : who === 'sherzod' ? 2000000 : 200);
  const cur = isBakh ? 'USD' : ct.cur;
  const total = isBakh ? +mat + +wrk : +amount;
  const to = isBakh ? 'owner' : ct.from;
  const send = () => {
    const minor = cur === 'USD' ? Math.round(total * 100) : Math.round(total);
    act(n => { n.requests.push({ id: uid('r'), from: who, to, kind, amount: minor, cur, parts: isBakh ? 'материалы $' + nf0.format(mat) + ', работы $' + nf0.format(wrk) : 'аванс по договору', status: 'new', contract: isBakh ? null : who }); });
    say('Запрос отправлен: ' + (to === 'owner' ? 'Джурабек' : P[to].short) + ' увидит его в «Ждёт вас»'); go({ tg: 'home' });
  };
  return html`<div>
    <${TgCard}><div className="text-[11px] text-slate-500 mb-1.5">Назначение</div>
      <${Seg} small value=${kind} onChange=${setKind} options=${isBakh ? [['Под отчёт', 'Под отчёт'], ['Аванс', 'Аванс'], ['Транш', 'След. транш']] : [['Аванс', 'Аванс по работам']]} />
      <div className="mt-2 text-[11px] text-slate-500">Кому: ${to === 'owner' ? 'Джурабек Ганиев (Ganiev Development)' : P[to].name}</div><//>
    ${isBakh ? html`<${TgCard}><div className="text-sm font-semibold text-slate-900">Разбивка <span className="font-normal text-slate-400 text-xs">· по желанию</span></div>
        <div className="mt-2 grid grid-cols-2 gap-2"><label><span className="text-[11px] text-slate-500">Материалы, $</span><input type="number" className=${cx(inputCls, 'num mt-0.5')} value=${mat} onChange=${e => setMat(e.target.value)} /></label>
          <label><span className="text-[11px] text-slate-500">Работы, $</span><input type="number" className=${cx(inputCls, 'num mt-0.5')} value=${wrk} onChange=${e => setWrk(e.target.value)} /></label></div>
        <div className="mt-3 flex justify-between items-baseline"><span className="text-sm text-slate-500">Итого</span><span className="num text-2xl font-bold">${usd(Math.round(total * 100))}</span></div><//>`
      : html`<${TgCard}><label><span className="text-[11px] text-slate-500">Сумма, ${cur === 'USD' ? '$' : 'сум'}</span><input type="number" className=${cx(inputCls, 'num mt-0.5 text-lg font-semibold')} value=${amount} onChange=${e => setAmount(e.target.value)} /></label><//>`}
    <p className="mx-4 mt-3 text-[11px] text-slate-400">Запрос необязателен — заказчик может передать деньги и сам. Сумма передачи может отличаться от запрошенной.</p>
    <${Sticky}><${Btn} full size="lg" icon="send" disabled=${!(total > 0)} onClick=${send}>Отправить запрос<//><//></div>`;
}

/* ======================================================================
   Демо-панель и корень
   ====================================================================== */
const SCREENS = [
  ['web', 'projects', '1. Мои проекты'], ['web', 'balance', '2. Проект → Баланс'], ['web', 'contracts', '3. Договоры и цепочка'], ['web', 'smeta', '4. Смета и этапы'],
  ['web', 'expenses', '5. Расходы: проверка'], ['web', 'works', '6. Работы и приёмка'], ['web', 'report', '7. Отчёт по траншу'], ['web', 'proposal', '8. Предложение заказчику'],
  ['tg', 'home', '9. Главная исполнителя', 'bakh'], ['tg', 'expense', '10. + Расход одной строкой', 'bakh'], ['tg', 'pod', '11. Подотчёт: 7 цифр', 'bakh'],
  ['tg', 'work', '12. Сдать работу (кладка)', 'sherzod'], ['tg', 'accept', '13. Приёмка у прораба', 'bakh'], ['tg', 'contracts', '14. Мои договоры: мастер видит $8', 'nodir'], ['tg', 'request', '15. Запросить деньги', 'bakh'],
];
function DemoBar() {
  const { ui, go, reset } = useC();
  const cur = ui.ch + ':' + (ui.ch === 'web' ? ui.web : ui.tg);
  return html`<div className="no-print sticky top-0 z-40 bg-slate-950 text-white">
    <div className="max-w-7xl mx-auto px-3 py-2 flex flex-wrap items-center gap-2">
      <div className="flex items-center gap-2 mr-1"><span className="rounded bg-orange-600 px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide">макет</span><span className="text-xs text-slate-300 hidden md:inline">Tenderlink «Отчётность» · без бэкенда</span></div>
      <div className="inline-flex rounded-lg bg-white/10 p-0.5 text-xs">
        <button onClick=${() => go({ ch: 'web' })} className=${cx('rounded-md px-2.5 py-1 font-medium', ui.ch === 'web' ? 'bg-white text-slate-900' : 'text-slate-300')}>Веб-кабинет · менеджер</button>
        <button onClick=${() => go({ ch: 'tg' })} className=${cx('rounded-md px-2.5 py-1 font-medium', ui.ch === 'tg' ? 'bg-white text-slate-900' : 'text-slate-300')}>Telegram Mini App · исполнитель</button></div>
      ${ui.ch === 'tg' && html`<select value=${ui.who} onChange=${e => go({ who: e.target.value })} className="rounded-lg bg-white/10 text-xs px-2 py-1.5 text-white [&>option]:text-slate-900">
        <option value="bakh">Бахтиёр, прораб</option><option value="sherzod">Шерзод, бригадир</option><option value="nodir">Нодир, мастер</option></select>`}
      <div className="flex-1"></div>
      <select value=${cur} onChange=${e => { const s = SCREENS.find(x => x[0] + ':' + x[1] === e.target.value); go(s[0] === 'web' ? { ch: 'web', web: s[1] } : { ch: 'tg', tg: s[1], who: s[3], draft: null }); }}
        className="rounded-lg bg-white/10 text-xs px-2 py-1.5 text-white max-w-[52vw] [&>option]:text-slate-900 [&>optgroup]:text-slate-900">
        <optgroup label="Веб-кабинет">${SCREENS.filter(s => s[0] === 'web').map(s => html`<option key=${s[1]} value=${s[0] + ':' + s[1]}>${s[2]}</option>`)}</optgroup>
        <optgroup label="Telegram Mini App">${SCREENS.filter(s => s[0] === 'tg').map(s => html`<option key=${s[1]} value=${s[0] + ':' + s[1]}>${s[2]}</option>`)}</optgroup></select>
      <button onClick=${reset} className="rounded-lg bg-white/10 hover:bg-white/20 text-xs px-2.5 py-1.5 flex items-center gap-1.5" title="Вернуть исходные данные"><${Icon} n="refresh" s=${13} />Сбросить</button></div></div>`;
}
const UI0 = { ch: 'web', web: 'projects', tg: 'home', who: 'bakh', viewAs: 'owner', selContract: 'client', smetaMode: 'internal', expFilter: 'review', expWho: 'all', reportView: 'client', draft: null };
function App() {
  const [S, setS] = useState(init);
  const [ui, setUi] = useState(UI0);
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3400); return () => clearTimeout(t); }, [toast]);
  const act = fn => setS(p => { const n = structuredClone(p); fn(n); return n; });
  const go = patch => { setUi(u => ({ ...u, ...patch })); if (patch.web || patch.tg || patch.ch) window.scrollTo(0, 0); };
  const say = (msg, icon) => setToast({ msg, icon, k: Date.now() });
  const reset = () => { setS(init()); setUi(u => ({ ...UI0, ch: u.ch })); say('Демо-данные сброшены', 'refresh'); };
  const ask = spec => setModal(spec ? { ...spec, _k: Date.now() } : null);
  const ctx = { S, act, ui, go, say, ask, modal, reset };
  return html`<${Ctx.Provider} value=${ctx}><${DemoBar} />${ui.ch === 'web' ? html`<${Web} />` : html`<${Tg} />`}<${Modal} /><${Toast} t=${toast} /><//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
